name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元与集成测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 零依赖,直接跑测试
        run: npm test

  docker:
    name: Docker 构建与冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t web-music-player:ci .
      - name: 冒烟:容器内曲库 API 可达
        run: |
          docker run -d --name wmp -p 8787:8787 web-music-player:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/library >/dev/null; then
              echo "smoke ok after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "smoke failed, container logs:"
          docker logs wmp
          exit 1

  publish:
    name: 发布镜像到 GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签(语义化 + latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 包可见性设为公开
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vis=$(gh api /user/packages/container/web-music-player --jq .visibility || echo missing)
          echo "current visibility: $vis"
          if [ "$vis" != "public" ]; then
            gh api -X PATCH /user/packages/container/web-music-player/visibility -f visibility=public
          fi
