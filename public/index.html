<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>音乐</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>" />
  <link rel="stylesheet" href="/style.css?v=2" />
</head>
<body>
  <div id="app">
    <!-- 桌面侧栏 -->
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-icon">♫</span>
        <span class="brand-name">音乐</span>
      </div>
      <div class="side-section">
        <div class="side-title">资料库</div>
        <div id="folder-list"></div>
      </div>
      <div class="side-section">
        <div class="side-title">
          歌单
          <button id="btn-new-playlist" class="icon-btn sm" title="新建歌单">＋</button>
        </div>
        <div id="playlist-list"></div>
      </div>
      <div class="side-section">
        <div class="side-title">上传音乐</div>
        <label class="upload-box" for="upload-input">
          <span>选择音频文件…</span>
        </label>
        <input type="file" id="upload-input" accept=".mp3,.m4a,.ogg,.wav,.flac" multiple hidden />
        <div id="upload-status"></div>
      </div>
    </aside>

    <!-- 主区 -->
    <main id="main">
      <header id="topbar">
        <h1 id="view-title">资料库</h1>
        <div class="topbar-actions">
          <div class="search-box">
            <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
            <input type="search" id="search-input" placeholder="搜索" />
          </div>
          <button id="btn-theme" class="icon-btn" title="主题">◐</button>
        </div>
      </header>
      <div id="sub-toolbar">
        <button id="btn-play-all" class="pill-btn">▶ 播放全部</button>
        <label class="pill-btn outline mobile-upload" for="upload-input">＋ 上传音乐</label>
        <span id="track-count"></span>
      </div>
      <div id="track-list"></div>
    </main>

    <!-- 桌面右栏：队列 / 歌词 -->
    <aside id="rightbar">
      <div id="rightbar-tabs">
        <button class="rb-tab active" data-tab="queue">待播清单</button>
        <button class="rb-tab" data-tab="lyrics">歌词</button>
      </div>
      <div id="queue-panel" class="rb-panel active">
        <div class="rb-toolbar">
          <button id="btn-clear-queue" class="text-btn">清空</button>
        </div>
        <div id="queue-list"></div>
      </div>
      <div id="lyrics-panel" class="rb-panel">
        <div id="lyrics-content"><div class="lyrics-empty">暂无歌词</div></div>
      </div>
    </aside>

    <!-- 桌面底部播放条 -->
    <footer id="player-bar">
      <div id="now-playing">
        <div id="np-title">未在播放</div>
        <div id="np-artist"></div>
      </div>
      <div id="controls">
        <button id="btn-mode" class="icon-btn" title="播放模式">🔁</button>
        <button id="btn-prev" class="icon-btn" title="上一首">⏮</button>
        <button id="btn-play" class="play-btn" title="播放/暂停">▶</button>
        <button id="btn-next" class="icon-btn" title="下一首">⏭</button>
      </div>
      <div id="progress-area">
        <span id="time-current">0:00</span>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <span id="time-total">0:00</span>
      </div>
      <div id="volume-area">
        <button id="btn-mute" class="icon-btn" title="静音">🔊</button>
        <input type="range" id="volume-slider" min="0" max="100" value="80" />
      </div>
    </footer>
  </div>

  <!-- ══ 移动端 ══ -->

  <!-- 迷你播放条 -->
  <div id="mini-player" class="hidden">
    <div class="mini-info">
      <div id="mini-title">未在播放</div>
      <div id="mini-artist"></div>
    </div>
    <div class="mini-controls">
      <button id="mini-btn-play" class="icon-btn">▶</button>
      <button id="mini-btn-next" class="icon-btn">⏭</button>
    </div>
  </div>

  <!-- 底部标签栏 -->
  <nav id="tabbar">
    <button class="tab-btn active" data-view="library">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
      <span>资料库</span>
    </button>
    <button class="tab-btn" data-view="playlists">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 6h12v2H4zm0 4h12v2H4zm0 4h8v2H4zm12-1v6l5-3z"/></svg>
      <span>歌单</span>
    </button>
    <button class="tab-btn" data-view="queue">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 6h2v12H4zm4 0h2v12H8zm4 2h2v8h-2zm4-4h2v16h-2z"/></svg>
      <span>待播</span>
    </button>
  </nav>

  <!-- 移动端：歌单视图 -->
  <div id="m-view-playlists" class="m-view hidden">
    <header class="m-view-header">
      <h1>歌单</h1>
      <button id="m-btn-new-playlist" class="icon-btn">＋</button>
    </header>
    <div id="m-playlist-list"></div>
  </div>

  <!-- 移动端：队列视图 -->
  <div id="m-view-queue" class="m-view hidden">
    <header class="m-view-header">
      <h1>待播清单</h1>
      <button id="m-btn-clear-queue" class="text-btn">清空</button>
    </header>
    <div id="m-queue-list"></div>
  </div>

  <!-- 全屏播放页 -->
  <div id="full-player" class="hidden">
    <header class="fp-header">
      <button id="fp-close" class="icon-btn" title="收起">⌄</button>
      <span class="fp-caption">正在播放</span>
      <button id="fp-btn-theme" class="icon-btn" title="主题">◐</button>
    </header>
    <div class="fp-body">
      <div class="fp-art">♫</div>
      <div id="fp-title">未在播放</div>
      <div id="fp-artist"></div>
      <div class="fp-progress">
        <div id="fp-progress-bar"><div id="fp-progress-fill"></div></div>
        <div class="fp-times">
          <span id="fp-time-current">0:00</span>
          <span id="fp-time-total">0:00</span>
        </div>
      </div>
      <div class="fp-controls">
        <button id="fp-btn-mode" class="icon-btn" title="播放模式">🔁</button>
        <button id="fp-btn-prev" class="icon-btn lg" title="上一首">⏮</button>
        <button id="fp-btn-play" class="play-btn xl" title="播放/暂停">▶</button>
        <button id="fp-btn-next" class="icon-btn lg" title="下一首">⏭</button>
        <button id="fp-btn-lyrics" class="icon-btn" title="歌词">≡</button>
      </div>
      <div class="fp-volume">
        <span class="fp-vol-icon">🔈</span>
        <input type="range" id="fp-volume-slider" min="0" max="100" value="80" />
        <span class="fp-vol-icon">🔊</span>
      </div>
    </div>
    <div id="fp-lyrics" class="hidden">
      <button id="fp-lyrics-close" class="icon-btn" title="收起歌词">✕</button>
      <div id="fp-lyrics-content"><div class="lyrics-empty">暂无歌词</div></div>
    </div>
  </div>

  <audio id="audio"></audio>

  <!-- 加入歌单菜单 -->
  <div id="playlist-menu" class="hidden"></div>

  <script src="/app.js?v=2"></script>
</body>
</html>
